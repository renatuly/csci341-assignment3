# Render Blueprint: one web service + one PostgreSQL database.
databases:
  - name: conference-db
    plan: free
    databaseName: conference
services:
  - type: web
    name: csci341-conference
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conference-db
          property: connectionString
      - key: AUTO_INIT_DB      # creates and seeds the schema on first start if the DB is empty
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.8"
