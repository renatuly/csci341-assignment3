<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Conference Manager{% endblock %} · CSCI 341</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1d2433; background: #f6f7f9; }
  header { background: #1f3a5f; color: #fff; padding: 10px 24px; display: flex; gap: 20px; align-items: center; }
  header a { color: #fff; text-decoration: none; } header strong { margin-right: 16px; }
  main { padding: 20px 24px; max-width: 1200px; }
  table { border-collapse: collapse; background: #fff; margin: 8px 0 20px; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #d5d9e0; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eef1f5; }
  .flash { padding: 10px 12px; margin-bottom: 12px; border-radius: 4px; }
  .flash.ok { background: #e3f4e6; border: 1px solid #8fc79a; }
  .flash.error { background: #fbe4e4; border: 1px solid #e08f8f; }
  form.inline { display: inline; }
  label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
  input[type=text], input[type=email], input[type=date], input[type=time], input[type=number],
  input[type=datetime-local], select, textarea { width: 100%; max-width: 520px; padding: 5px; box-sizing: border-box; }
  textarea { min-height: 70px; }
  fieldset { background: #fff; border: 1px solid #d5d9e0; margin: 14px 0; max-width: 760px; }
  .btn { display: inline-block; padding: 5px 12px; border: 1px solid #1f3a5f; background: #1f3a5f; color: #fff;
         border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 14px; }
  .btn.light { background: #fff; color: #1f3a5f; } .btn.danger { background: #b03030; border-color: #b03030; }
  .muted { color: #667; font-size: 13px; }
  .authors td { border: none; padding: 2px 6px; } .authors select { min-width: 220px; }
</style>
</head>
<body>
<header>
  <strong>Conference &amp; Review Manager</strong>
  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('users_list') }}">Users</a>
  <a href="{{ url_for('papers_list') }}">Papers</a>
  <a href="{{ url_for('reviews_list') }}">Reviews</a>
  <a href="{{ url_for('sessions_list') }}">Sessions</a>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
